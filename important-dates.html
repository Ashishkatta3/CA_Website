<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Important Dates — MSS Advisory Services, Chartered Accountants</title>
  <meta name="description" content="Key GST, TDS, income tax and ROC due dates, month by month.">
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="resources">
<header id="site-header"></header>

<main class="bg-canvas" style="padding-bottom:96px">
  <section class="hero" style="padding-bottom:48px">
    <div class="wrap reveal">
      <p class="t-eyebrow">Compliance calendar</p>
      <h1 class="t-hero">Important dates.</h1>
      <p class="t-intro">Key statutory due dates, so nothing catches you by surprise.</p>
    </div>
  </section>
  <div class="wrap">
    <div class="filters" id="filters" role="group" aria-label="Filter by type"></div>
    <div id="months"></div>
    <div class="banner">
      <p>Want us to track these for you?</p>
      <a class="btn btn--primary" href="contact.html">Talk to us</a>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var S = SITE, esc = S.esc;
  var monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  var types = [["all", "All"], ["GST", "GST"], ["TDS", "TDS"], ["IT", "Income Tax"], ["ROC", "ROC"]];
  var filters = document.getElementById("filters");
  filters.innerHTML = types.map(function (t) { return '<button type="button" data-t="' + t[0] + '">' + t[1] + "</button>"; }).join("");

  // Official portal where each due date is published
  var portals = {
    GST: ["GST Portal", "https://www.gst.gov.in/"],
    TDS: ["Income Tax Department", "https://incometaxindia.gov.in/"],
    TRACES: ["TRACES", "https://www.tdscpc.gov.in/"],
    IT: ["Income Tax e-Filing", "https://www.incometax.gov.in/"],
    ROC: ["Ministry of Corporate Affairs", "https://www.mca.gov.in/"]
  };
  function source(d) {
    var p = portals[d[1] === "TDS" && /statement|certificate/i.test(d[2]) ? "TRACES" : d[1]];
    return '<a class="date-src" href="' + p[1] + '" target="_blank" rel="noopener">Source: ' + p[0] + " " + S.icon("arrowUpRight") + "</a>";
  }

  function render(type) {
    filters.querySelectorAll("button").forEach(function (b) {
      var on = b.getAttribute("data-t") === type;
      b.classList.toggle("is-active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var list = S.upcoming(999).filter(function (d) { return type === "all" || d[1] === type; });
    var groups = [], cur = null;
    list.forEach(function (d) {
      var dt = new Date(d[0] + "T00:00:00"), key = monthNames[dt.getMonth()] + " " + dt.getFullYear();
      if (!cur || cur.key !== key) { cur = { key: key, items: [] }; groups.push(cur); }
      cur.items.push([dt, d]);
    });
    document.getElementById("months").innerHTML = groups.map(function (g) {
      return '<section class="month fade-up"><h2>' + g.key + "</h2><ul>" + g.items.map(function (x) {
        var dt = x[0], d = x[1];
        return '<li><div class="date-box"><b>' + dt.getDate() + "</b><small>" + days[dt.getDay()] + "</small></div><div><div><p>" + esc(d[2]) + "</p>" +
          (d[3] ? '<p class="mt-2 muted" style="font-size:13px">' + esc(d[3]) + "</p>" : "") + source(d) + '</div><span><span class="tag tag--' + d[1] + '">' + S.dateTypes[d[1]] + "</span></span></div></li>";
      }).join("") + "</ul></section>";
    }).join("") || '<p class="center mt-12 muted">No upcoming dates listed for this category yet.</p>';
  }
  filters.addEventListener("click", function (e) { var b = e.target.closest("button"); if (b) render(b.getAttribute("data-t")); });
  render("all");
})();
</script>
</body>
</html>
