<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — MSS Advisory Services, Chartered Accountants</title>
  <meta name="description" content="Contact MSS Advisory Services, Chartered Accountants — offices in Lakshmipuram, Guntur and Mogalrajpuram, Vijayawada.">
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<header id="site-header"></header>

<main class="bg-canvas" style="padding-bottom:96px">
  <section class="hero" style="padding-bottom:56px">
    <div class="wrap reveal">
      <p class="t-eyebrow">Contact us</p>
      <h1 class="t-hero">Let's talk.</h1>
      <p class="t-intro">Tell us a little about your requirement and the right person from our team will get back to you.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="contact-grid">
      <form class="form-card" id="enquiry-form" novalidate>
        <fieldset>
          <legend>Your details</legend>
          <div class="float"><input type="text" id="f-name" name="name" placeholder=" " autocomplete="name" required><label for="f-name">Full name *</label></div>
          <div class="form-row">
            <div class="float"><input type="tel" id="f-phone" name="phone" placeholder=" " autocomplete="tel" required><label for="f-phone">Phone *</label></div>
            <div class="float"><input type="email" id="f-email" name="email" placeholder=" " autocomplete="email" required><label for="f-email">Email *</label></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>I am a…</legend>
          <div class="choice-grid" id="client-types"></div>
        </fieldset>
        <fieldset>
          <legend>I need help with</legend>
          <p class="hint">Select all that apply.</p>
          <div class="choice-grid" id="needs"></div>
        </fieldset>
        <fieldset>
          <legend>Tell us about your requirement</legend>
          <div class="float"><textarea id="f-msg" name="message" placeholder=" "></textarea><label for="f-msg">A few lines about your situation and any deadlines.</label></div>
        </fieldset>
        <input class="hp" type="text" name="company_website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <label class="consent"><input type="checkbox" name="consent" id="f-consent" required><span>I agree to be contacted about my enquiry. My information will be kept confidential and handled as described in the <a href="privacy.html">privacy policy</a>.</span></label>
        <div class="form-actions">
          <button class="btn btn--primary" type="submit">Submit enquiry</button>
          <p class="form-status" id="form-status" role="status"></p>
        </div>
      </form>

      <aside class="contact-side" id="visit" style="scroll-margin-top:96px">
        <div class="card">
          <h2>Reach us directly</h2>
          <ul id="direct"></ul>
        </div>
        <div class="card">
          <h2 id="hours-title">Office hours</h2>
          <dl class="hours" id="hours"></dl>
        </div>
        <div id="maps"></div>
      </aside>
    </div>
  </div>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var S = SITE, F = S.firm, icon = S.icon, esc = S.esc;
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);

  var phones = [[F.phone, F.phoneHref], [F.mobile, F.mobileHref]].filter(function (p) { return p[0]; });
  $("direct").innerHTML =
    (phones.length ? "<li>" + icon("phone") + "<span>" + phones.map(function (p) { return '<a href="' + p[1] + '">' + p[0] + "</a>"; }).join("<br>") + "</span></li>" : "") +
    "<li>" + icon("mail") + '<a href="mailto:' + F.email + '">' + F.email + "</a></li>" +
    F.offices.map(function (o) { return "<li>" + icon("pin") + "<span><b>" + esc(o.name) + "</b><br>" + o.lines.map(esc).join("<br>") + "</span></li>"; }).join("");
  $("hours-title").insertAdjacentHTML("afterbegin", icon("clock"));
  if (F.hours.length) $("hours").innerHTML = F.hours.map(function (h) { return "<div><dt>" + h[0] + "</dt><dd>" + h[1] + "</dd></div>"; }).join("");
  else $("hours").parentNode.remove();
  $("maps").innerHTML = F.offices.map(function (o) {
    return '<p class="map-label">' + esc(o.name) + '</p><div class="map"><iframe title="Map: ' + esc(o.name) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=' + encodeURIComponent(o.map) + '&z=15&output=embed"></iframe></div>';
  }).join("");

  var types = [["individuals", "Individual"], ["smb", "Business Owner"], ["corporates", "Company"], ["startups", "Startup"], ["professionals", "Professional"], ["nonprofits", "Non-Profit"], ["other", "Other"]];
  var forParam = params.get("for");
  $("client-types").innerHTML = types.map(function (t) {
    return '<label class="choice"><input type="radio" name="clientType" value="' + t[1] + '"' + (t[0] === forParam ? " checked" : "") + "><span>" + t[1] + "</span></label>";
  }).join("");
  var svcParam = params.get("service");
  $("needs").innerHTML = S.services.map(function (s) {
    return '<label class="choice"><input type="checkbox" name="needs" value="' + esc(s.short) + '"' + (s.id === svcParam ? " checked" : "") + "><span>" + esc(s.short) + "</span></label>";
  }).join("") + '<label class="choice"><input type="checkbox" name="needs" value="Other"><span>Other</span></label>';

  // Enquiries are delivered to the firm's inbox through FormSubmit (formsubmit.co).
  // If that fails (offline, service down), fall back to the visitor's email app.
  var form = $("enquiry-form"), status = $("form-status"), btn = form.querySelector('button[type="submit"]');
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var d = new FormData(form);
    if (d.get("company_website")) return;
    var name = (d.get("name") || "").trim(), phone = (d.get("phone") || "").trim(), email = (d.get("email") || "").trim();
    var err = !name ? "Please enter your name." : !phone ? "Please enter your phone number." :
      !/^\S+@\S+\.\S+$/.test(email) ? "Please enter a valid email address." : !d.get("consent") ? "Please agree to be contacted." : "";
    status.className = "form-status" + (err ? " err" : "");
    status.textContent = err;
    if (err) return;
    var fields = {
      Name: name, Phone: phone, Email: email,
      "I am a": d.get("clientType") || "—",
      "Need help with": d.getAll("needs").join(", ") || "—",
      Message: (d.get("message") || "").trim() || "—"
    };
    btn.disabled = true;
    status.textContent = "Sending…";
    S.sendEnquiry("Website enquiry from " + name, fields, email).then(function () {
      form.reset();
      status.textContent = "Thank you — your enquiry has been sent. We'll get back to you soon.";
    }).catch(function () {
      var body = Object.keys(fields).map(function (k) { return k + ": " + fields[k]; }).join("\n");
      window.location.href = "mailto:" + F.email + "?subject=" + encodeURIComponent("Website enquiry from " + name) + "&body=" + encodeURIComponent(body);
      status.textContent = "We couldn't send it directly, so we've opened your email app with the enquiry filled in.";
    }).then(function () { btn.disabled = false; });
  });
})();
</script>
</body>
</html>
