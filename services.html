<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services — MSS Advisory Services, Chartered Accountants</title>
  <meta name="description" content="Income tax, GST, TDS, accounting, compliance, project reports, CMA data and business advisory from MSS Advisory Services, Guntur.">
  <meta name="theme-color" content="#fafafc">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="services">
<header id="site-header"></header>

<main class="bg-canvas" style="padding-bottom:96px">
  <section style="padding:64px 0 48px">
    <div class="wrap">
      <h1 class="t-hero max-3xl reveal">Services. <span style="color:var(--ink-2)">Everything your finances need, under one roof.</span></h1>
      <nav class="icon-nav no-scrollbar mt-12 reveal" id="icon-nav" aria-label="Services"></nav>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 class="font-display" style="font-size:28px;font-weight:600">All services. <span style="color:var(--ink-2)">Pick what you need.</span></h2>
      <ul class="svc-grid mt-8" id="svc-grid"></ul>
      <div class="banner reveal">
        <div><p>Not sure what you need?</p><p class="mt-2 muted">Describe your situation and we'll point you to the right service.</p></div>
        <a class="btn btn--primary" href="contact.html" style="flex-shrink:0">Ask us</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var S = SITE, esc = S.esc;
  document.getElementById("icon-nav").innerHTML = S.services.map(function (s) {
    return '<a href="service.html?s=' + s.id + '">' + S.appIcon(s) + "<span>" + esc(s.name) + "</span></a>";
  }).join("");
  document.getElementById("svc-grid").innerHTML = S.services.map(function (s) {
    return '<li class="reveal"><a class="svc-card" href="service.html?s=' + s.id + '">' + S.appIcon(s) + "<h3>" + esc(s.name) + "</h3><p>" + esc(s.summary) +
      "</p><footer><span>" + s.items.length + " services included</span><span>Learn more ›</span></footer></a></li>";
  }).join("");
})();
</script>
</body>
</html>
