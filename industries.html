<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who We Serve — MSS Advisory Services, Chartered Accountants</title>
  <meta name="description" content="Accounting, tax and compliance support for startups, small and medium businesses, corporates, individuals, professionals and non-profits.">
  <meta name="theme-color" content="#fbf9f4">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="industries">
<header id="site-header"></header>

<main>
  <section class="hero" style="padding-bottom:56px">
    <div class="wrap reveal">
      <p class="t-eyebrow">Who we serve</p>
      <h1 class="t-hero">Different needs.<br>One trusted team.</h1>
      <p class="t-intro">A startup, a family business and a salaried professional need very different things. Choose what describes you best.</p>
    </div>
  </section>

  <section class="bg-canvas section">
    <div class="wrap"><div id="segments"></div></div>
  </section>

  <section class="bg-white section center">
    <div class="wrap reveal">
      <h2 class="t-headline">Don't see yourself here?</h2>
      <p class="t-intro mx-auto mt-4 max-xl muted">We work with many kinds of clients. Tell us about yours.</p>
      <a class="btn btn--primary mt-8" href="contact.html">Get in touch</a>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
(function () {
  var ids = SITE.industries.map(function (i) { return i.id; });
  var root = document.getElementById("segments");
  function fromHash() { var h = location.hash.slice(1); return ids.indexOf(h) >= 0 ? h : null; }
  var show = renderSegments(root, {
    initial: fromHash() || ids[0],
    onChange: function (id) { if (location.hash.slice(1) !== id && history.replaceState) history.replaceState(null, "", "#" + id); }
  });
  window.addEventListener("hashchange", function () {
    var id = fromHash();
    if (id) { show(id); root.scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  if (fromHash()) setTimeout(function () { window.scrollTo(0, root.getBoundingClientRect().top + window.scrollY - 80); }, 50);
})();
</script>
</body>
</html>
